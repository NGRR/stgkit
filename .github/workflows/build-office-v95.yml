name: Replace STGND PowerPoint

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-office-v95.yml'

permissions:
  contents: write

jobs:
  replace-pptx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download uploaded PowerPoint
        env:
          SOURCE_URL: "https://sdmntprnznorth.oaiusercontent.com/files/00000000-b0c8-820b-a9e2-1089efe81c61/raw?se=2026-09-22T16%3A34%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=aad367fd-84f3-50aa-9c69-2aa6238daa6b&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-22T15%3A32%3A56Z&ske=2026-09-23T15%3A32%3A56Z&sks=b&skv=2026-02-06&sig=TprrUEEZmKhL2lgI9y/WTVQm1XGt1nR7h3KvImqjums%3D"
          EXPECTED_SHA256: "7e513f2a9b86613e4d31f4a6426964533544a488c7e2ee520057017bc2d45b51"
          TARGET: "formatos/pptx/STGND_Presentacion_Maestro_v9.pptx"
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$SOURCE_URL" -o "$TARGET"
          test "$(stat -c%s "$TARGET")" = "7576095"
          echo "$EXPECTED_SHA256  $TARGET" | sha256sum -c -
      - name: Commit replacement
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add formatos/pptx/STGND_Presentacion_Maestro_v9.pptx
          git diff --cached --quiet && exit 0
          git commit -m "chore: reemplazar presentación maestra STGND"
          git push origin HEAD:main
