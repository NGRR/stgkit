name: Build Alfred visual v9.6

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/build_alfred_visual_v96.py'
      - '.github/workflows/build-alfred-v96.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check python-docx
      - name: Build Alfred package
        run: python tools/build_alfred_visual_v96.py
      - name: Commit generated Alfred package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "base/STGND - Oficio.zip" "base/originales/STGND - Oficio_original.zip"
          if git diff --cached --quiet; then
            echo "No Alfred binary changes to commit."
            exit 0
          fi
          git commit -m "chore: actualizar formatos Alfred a v9.6 [skip ci]"
          git push
