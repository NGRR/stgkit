name: Build com_stgdocumentos 0.2.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'tools/build_com_stgdocumentos_024.py'
      - 'tools/stgdocumentos_024_skeleton.b64'
      - '.github/workflows/build-com-stgdocumentos-024.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Joomla package
        run: python tools/build_com_stgdocumentos_024.py
      - name: Validate package
        run: |
          unzip -t dist/com_stgdocumentos_0.2.4.zip
          unzip -l dist/com_stgdocumentos_0.2.4.zip | grep "admin/masters/catalog/STGND_Presentacion_v3_2026.pptx"
          unzip -l dist/com_stgdocumentos_0.2.4.zip | grep "admin/masters/alfred/STGND - Minuta.docx"
      - uses: actions/upload-artifact@v4
        with:
          name: com-stgdocumentos-0.2.4
          path: dist/com_stgdocumentos_0.2.4.zip
          if-no-files-found: error
